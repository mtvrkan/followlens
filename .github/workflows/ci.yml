# Everything `npm run verify` runs locally, run again on every push and pull
# request. The repository had 351 tests and nothing that ran them: a suite
# nobody executes is documentation, not a safety net.
#
# Actions are pinned to a full commit SHA rather than a tag. A tag is mutable —
# tj-actions/changed-files was rewritten under its own tag in 2025 to exfiltrate
# secrets from every workflow that referenced it. The version each SHA
# corresponds to is in the comment beside it; to update, resolve the new tag to
# its commit and change both together.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. Nothing here publishes, comments or writes back.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref; the results of the
# older one would be discarded anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # `ci`, never `install`: it fails on a lockfile that disagrees with
      # package.json instead of quietly resolving something else.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      # The landing page has no build step, so this is the only thing standing
      # between it and a missing translation, a broken script, or a third-party
      # request on a site whose whole claim is that it makes none.
      - name: Check the site
        run: npm run check:site

      - name: Build
        run: npm run build

      # Advisory: a new CVE in a transitive dependency should show up in the run
      # that follows it, but it is not this pull request's author's fault and
      # should not block their merge.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true
