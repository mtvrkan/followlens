<!-- FollowLens mark.
     A lens with two accounts inside it: one solid, one already fading out. The
     product in one glyph — you are looking at your circle, and someone in it is
     on the way out.

     The plate carries the extension's own brand gradient (Tailwind
     `bg-gradient-brand`: hsl(258 90% 58%) -> hsl(231 90% 60%) at 135deg), so the
     toolbar icon, the in-app header and this site all resolve to the same mark.
     public/icon{16,48,128}.png are rendered from this file — regenerate them
     together, never one alone.

     The pages do NOT load this file for their on-page logo; they carry the same
     geometry inline as the sprite's #i-mark symbol, because a host that serves
     .svg as application/octet-stream makes Chrome refuse to paint an <img>.
     This file is still what the PNGs and the favicon come from, so a change
     here means updating #i-mark in index.html, privacy.html and 404.html too,
     then re-running render-icons.cjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="FollowLens">
  <defs>
    <linearGradient id="fl-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d3ff0"/>
      <stop offset="1" stop-color="#3b5bf0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#fl-plate)"/>
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round">
    <circle cx="54" cy="55" r="24"/>
    <path d="M71 72 L95 96"/>
  </g>
  <circle cx="45.5" cy="55" r="8" fill="#fff"/>
  <circle cx="62.5" cy="55" r="6.8" fill="#fff" opacity=".42"/>
</svg>
